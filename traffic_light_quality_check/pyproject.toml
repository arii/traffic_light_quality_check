[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-light-quality-check"
version = "0.1.0"
description = "Automated quality checks for Traffic Sign annotations"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0.0",
]

[project.scripts]
traffic-light-check = "traffic_light.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
